<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Beats and videos from a working producer. Pay with Mobile Money or bank transfer and get your files by email." />
    <meta name="theme-color" content="#2563eb" />
    <title>Beat Store</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/styles.css" />
    <script>
      /* Paint the saved look before the first frame so the colours never flash. */
      (function () {
        try {
          var look = JSON.parse(localStorage.getItem('bs.look.v1') || 'null');
          var root = document.documentElement;
          root.dataset.mode = look && look.dark ? 'dark' : 'light';
          root.dataset.glass = look && look.glass !== undefined ? look.glass : '2';
        } catch (e) { /* first visit */ }
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to content</a>
    <header class="site-header" id="siteHeader"></header>
    <main id="view" class="page"><div class="loader" aria-label="Loading"></div></main>
    <footer class="site-footer" id="siteFooter"></footer>
    <div class="player-bar hidden" id="playerBar" role="region" aria-label="Beat preview player"></div>
    <div class="theme-dock" id="themeDock"></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
